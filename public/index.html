<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FB Auto‑Sharer · Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: #f4f6fa;
      padding: 2rem 1rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container { max-width: 1280px; width: 100%; }
    .header { margin-bottom: 2rem; display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
    .header h1 {
      font-size: 2rem; font-weight: 600; color: #1e293b;
      letter-spacing: -0.02em; display: flex; align-items: center; gap: 0.75rem;
    }
    .header h1 i { color: #1877f2; font-size: 2.2rem; }
    .badge {
      background: #e2e8f0; padding: 0.25rem 0.9rem; border-radius: 999px;
      font-size: 0.85rem; font-weight: 500; color: #334155;
    }
    .grid { display: grid; grid-template-columns: 1fr 1.6fr; gap: 1.8rem; align-items: start; }
    @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
    .card {
      background: #ffffff; border-radius: 1.5rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04), 0 2px 6px rgba(0, 0, 0, 0.02);
      padding: 1.8rem 1.8rem 2rem; border: 1px solid #e9eef2; transition: box-shadow 0.2s;
    }
    .card:hover { box-shadow: 0 12px 30px rgba(0, 0, 0, 0.06); }
    .card h2 {
      font-size: 1.3rem; font-weight: 600; color: #0f172a;
      display: flex; align-items: center; gap: 0.6rem; margin-bottom: 1.5rem;
    }
    .card h2 i { color: #1877f2; font-size: 1.2rem; }
    .form-group { margin-bottom: 1.2rem; }
    label {
      display: block; font-size: 0.85rem; font-weight: 500;
      color: #334155; margin-bottom: 0.35rem; letter-spacing: 0.01em;
    }
    label i { margin-right: 0.3rem; color: #64748b; font-size: 0.8rem; }
    input, textarea {
      width: 100%; padding: 0.75rem 1rem; border-radius: 0.9rem;
      border: 1.5px solid #e2e8f0; background: #fafcff;
      font-size: 0.95rem; transition: 0.15s; outline: none; font-family: inherit;
    }
    input:focus, textarea:focus {
      border-color: #1877f2; box-shadow: 0 0 0 3px rgba(24, 119, 242, 0.1); background: #ffffff;
    }
    textarea { resize: vertical; min-height: 90px; font-size: 0.85rem; line-height: 1.4; }
    .row { display: flex; gap: 1rem; }
    .row .form-group { flex: 1; }
    .btn {
      background: #1877f2; border: none; color: white; font-weight: 600;
      padding: 0.85rem 1.8rem; border-radius: 2rem; font-size: 1rem;
      cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
      gap: 0.6rem; transition: 0.2s; width: 100%; margin-top: 0.6rem;
      box-shadow: 0 4px 10px rgba(24, 119, 242, 0.25);
    }
    .btn:hover { background: #0b5ed7; box-shadow: 0 8px 16px rgba(24, 119, 242, 0.3); transform: translateY(-1px); }
    .btn:disabled { background: #94a3b8; box-shadow: none; cursor: not-allowed; transform: none; }
    .status-msg {
      margin-top: 1rem; font-size: 0.9rem; padding: 0.8rem 1rem;
      border-radius: 1rem; display: none; align-items: center; gap: 0.6rem;
    }
    .status-msg.success { background: #e6f7ed; color: #0b6e3f; border-left: 4px solid #2ecc71; display: flex; }
    .status-msg.error { background: #fee9e7; color: #b91c1c; border-left: 4px solid #ef4444; display: flex; }
    .session-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .session-table th {
      text-align: left; padding: 0.6rem 0.4rem 0.6rem 0; font-weight: 600;
      color: #475569; border-bottom: 1px solid #e2e8f0;
      font-size: 0.75rem; text-transform: uppercase;
    }
    .session-table td {
      padding: 0.7rem 0.4rem 0.7rem 0; border-bottom: 1px solid #f1f5f9;
      vertical-align: middle; color: #1e293b;
    }
    .session-table tr:last-child td { border-bottom: none; }
    .url-cell {
      max-width: 180px; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.75rem; color: #3b4a5e; background: #f8fafc;
      padding: 0.2rem 0.5rem; border-radius: 6px; display: inline-block;
    }
    .badge-count {
      background: #e8f0fe; color: #1877f2; font-weight: 600;
      padding: 0.2rem 0.7rem; border-radius: 999px; font-size: 0.75rem;
    }
    .badge-target {
      background: #f1f5f9; color: #475569; padding: 0.2rem 0.7rem;
      border-radius: 999px; font-size: 0.75rem;
    }
    .error-badge {
      background: #fee2e2; color: #b91c1c; font-size: 0.7rem;
      padding: 0.2rem 0.5rem; border-radius: 12px; max-width: 120px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block;
    }
    .refresh-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .refresh-bar button {
      background: transparent; border: 1px solid #d1d9e6; border-radius: 30px;
      padding: 0.4rem 1rem; font-size: 0.8rem; font-weight: 500;
      color: #334155; cursor: pointer; display: flex; align-items: center; gap: 0.4rem;
    }
    .refresh-bar button:hover { background: #f1f5f9; border-color: #94a3b8; }
    .empty-state { text-align: center; padding: 2.5rem 1rem; color: #94a3b8; font-size: 0.9rem; }
    .empty-state i { font-size: 2rem; margin-bottom: 0.8rem; opacity: 0.6; }
    .footer-note {
      margin-top: 1.5rem; font-size: 0.75rem; color: #94a3b8;
      text-align: center; padding-top: 1rem; border-top: 1px solid #e2e8f0;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1><i class="fab fa-facebook-square"></i> FB Auto‑Sharer <span class="badge"><i class="fas fa-bolt"></i> live</span></h1>
  </div>

  <div class="grid">
    <!-- LEFT: form -->
    <div class="card">
      <h2><i class="fas fa-paper-plane"></i> New share session</h2>
      <form id="shareForm">
        <div class="form-group">
          <label><i class="fas fa-cookie-bite"></i> Cookie (appstate JSON or raw)</label>
          <textarea id="cookie" placeholder='Paste JSON array or raw cookie string …' required></textarea>
        </div>
        <div class="form-group">
          <label><i class="fas fa-link"></i> Post URL</label>
          <input type="url" id="url" placeholder="https://www.facebook.com/…" required />
        </div>
        <div class="row">
          <div class="form-group">
            <label><i class="fas fa-hashtag"></i> Amount</label>
            <input type="number" id="amount" min="1" value="10" required />
          </div>
          <div class="form-group">
            <label><i class="fas fa-clock"></i> Interval (sec)</label>
            <input type="number" id="interval" min="1" value="3" required />
          </div>
        </div>
        <button type="submit" class="btn" id="submitBtn"><i class="fas fa-play"></i> Start sharing</button>
        <div id="statusMsg" class="status-msg"></div>
      </form>
    </div>

    <!-- RIGHT: sessions -->
    <div class="card">
      <div class="refresh-bar">
        <h2 style="margin-bottom:0;"><i class="fas fa-chart-simple"></i> Active sessions</h2>
        <button id="refreshBtn"><i class="fas fa-rotate-right"></i> Refresh</button>
      </div>
      <div id="sessionsContainer">
        <div class="empty-state" id="emptyState">
          <i class="fas fa-circle-notch"></i>
          <div>Loading sessions…</div>
        </div>
        <table class="session-table" id="sessionTable" style="display: none;">
          <thead>
            <tr>
              <th>#</th><th>URL / ID</th><th>Count</th><th>Target</th><th>Error</th>
            </tr>
          </thead>
          <tbody id="sessionBody"></tbody>
        </table>
      </div>
      <div class="footer-note" style="margin-top: 1rem; border: none; padding-top: 0;">
        <i class="fas fa-rotate"></i> Auto‑refresh every 5s
      </div>
    </div>
  </div>
</div>

<script src="index.js"></script>
</body>
</html>
